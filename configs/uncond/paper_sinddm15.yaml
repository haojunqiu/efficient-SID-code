# Unconditional generation on sinddm15 -- the configuration the metrics in Table 1 of the
# paper were run with.
#
# FROZEN: pinned to the settings that run used, and left alone when the other presets in this
# directory change. Two settings differ from exact.yaml, which it is otherwise a copy of:
#
#   num_scales: 4 / min_short_side: null   the depth it was run at, rather than a coarsest
#                    scale pinned by min_short_side
#   bottleneck_dtype: float32              the precision it was run at, rather than bfloat16
#
# For what a knob means, start at UncondAppConfig (efficient_sid/config.py):
# it declares the top-level knobs and names the class behind each group.
seed: 10
num_samples: 1

# Input and output
image_path: ???          # required: path to input image
final_output_path: null   # optional: where to save result
preview_long_side: null
input_resize_to: null     # e.g. "(256, 256)" or null
output_size: null

# Latent-space acceleration -- disabled here. Do not just flip it on: patch_size and num_scales
# below are tuned for pixel space. From ~512px up, use configs/uncond/latent_exact.yaml instead.
latent:
  enabled: false
  vae_dtype: "bfloat16"

pyramid:
  relative_scale: 0.5
  num_scales: 4
  min_short_side: null

image_denoiser:
  patch_size: 15
  dataset_stride: 1
  query_stride: 1
  fold_rho: 0.2
  patch_denoiser:
    type: "exact"    # per-scale: "exact", "exact_flash_attn", "ann", "ann_flash_attn"
    bottleneck_dtype: "float32"
    query_chunks: 1

scheduler:
  type: "flow_linear"
  num_steps: 10
  sigma_min: 1e-4
  eta: 0.0

precision:
  dtype: "bfloat16"
  matmul: "highest"

diagnostics:              # neither changes the result
  report_timing: true
  intermediate_output_dir: null
