# Unconditional generation — LATENT SPACE, approximate k-NN backend (FAISS).
#
# Same as latent_exact.yaml except image_denoiser.patch_denoiser.type: "ann" and the ANN block (k, index_type, nlist, nprobe: 8, pq_m).
# For inputs large enough that even the latent dataset is big (latent short side well over
# ~256); on a smaller latent exact is already fast and the index build never amortizes.
seed: 10
num_samples: 1

# Input and output
image_path: ???
final_output_path: null
preview_long_side: null
input_resize_to: null
output_size: null         # <-- in pixels, not in latent space

# Latent-space acceleration
latent:
  enabled: true
  vae_dtype: "bfloat16"

pyramid:
  relative_scale: 0.5
  num_scales: auto          # or an integer to pick the depth yourself
  min_short_side: 14        # the coarsest latent scale's short side; 2.0x patch_size

image_denoiser:
  patch_size: 7             # latents are ~8x smaller per dim, so the pixel-space 15 is far too large
  dataset_stride: 1
  query_stride: 1
  fold_rho: .inf
  patch_denoiser:
    type: "ann"      # needs faiss-gpu
    bottleneck_dtype: "bfloat16"
    query_chunks: 1           # raise (e.g. 8-32) if a very large latent runs out of memory
    k: 5
    index_type: "ivf"
    nlist: null
    nprobe: 8                # lists probed per query; raise it if a small dataset returns fewer than k
    pq_m: 16                # only used when index_type is "ivfpq"

scheduler:
  type: "flow_linear"
  num_steps: 20
  sigma_min: 1e-4
  eta: 1.0

precision:
  dtype: "bfloat16"
  matmul: "highest"

diagnostics:              # neither changes the result
  report_timing: true
  intermediate_output_dir: null
