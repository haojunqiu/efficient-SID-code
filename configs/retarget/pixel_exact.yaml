# Retargeting: rebuild an image at a new resolution / aspect ratio from its own patches.
#
# The reference backend (exact), which runs on any GPU. On larger inputs it runs out of memory:
# use pixel_exact_flash_attn.yaml (this file with the fused-attention backend; identical math, far
# less memory), or raise query_chunks. See "Making it fast" in the README.
#
# The coarsest scale is fixed -- the input resized to the target shape, never denoised -- so it
# gets no denoiser and may fall below patch_size.
#
# "auto" descends until that fixed scale lands exactly on min_short_side, measured on the smaller
# of the input and the target, since patches come out of one and go into the other. min_short_side
# is patch_size rather than the ~1.5-2x other applications use; the coarsest *denoised* scale --
# the one holding a dataset -- is one halving above it, so 1-2x patch_size depending on the size.
#
# For what a knob means, start at RetargetAppConfig (efficient_sid/config.py):
# it declares the top-level knobs and names the class behind each group.
seed: 0
num_samples: 1

# Input and output
image_path: ???
final_output_path: null
preview_long_side: null
input_resize_to: null
output_size: null   # required: "(H,W)" target resolution

# Latent-space acceleration -- disabled here, and retargeting has no tuned latent preset. To
# enable it, try 7 or smaller for patch_size and min_short_side; num_scales is auto and follows.
latent:
  enabled: false
  vae_dtype: "bfloat16"

pyramid:
  relative_scale: 0.5
  num_scales: auto          # or an integer to pick the depth yourself
  min_short_side: 15        # = patch_size: the short side the fixed coarsest scale lands on

image_denoiser:
  patch_size: 15
  dataset_stride: 1
  query_stride: 1
  fold_rho: 0.2
  patch_denoiser:
    type: "exact"
    bottleneck_dtype: "bfloat16"
    query_chunks: 1           # increase to 4-8 for large targets (>250px short side at 2x width)

scheduler:
  type: "flow_linear"
  num_steps: 25             # quality/speed trade-off; 10-50 all work, and 10 looks near-identical here
  sigma_min: 1e-4
  eta: 1.0                  # try anywhere in 0.0-1.0; 1.0 is slightly better, especially for wider targets

precision:
  dtype: "bfloat16"
  matmul: "highest"

diagnostics:              # neither changes the result
  report_timing: true
  intermediate_output_dir: null
